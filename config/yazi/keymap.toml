# Open selection in the existing vim pane of the current tmux window.
# Yazi's `shell` does not populate "$@"; `%s` splats the selected files
# (falling back to the hovered file) with shell escaping applied.
[[mgr.prepend_keymap]]
on   = [ "O" ]
run  = '''
shell --block '~/.config/yazi/open-in-vim.sh %s'
'''
desc = "Open in existing tmux vim pane"

[[mgr.prepend_keymap]]
on   = [ "F" ]
run  = "create --dir"
desc = "New folder"

[[mgr.prepend_keymap]]
on   = [ "o" ]
run  = '''
shell --block '~/.config/yazi/open-in-vim.sh %s'
'''
desc = "Open in existing tmux vim pane"
