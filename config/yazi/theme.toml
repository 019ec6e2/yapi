# Ayu v2 dark theme for yazi — matches ~/.vim/colors/ayu2.vim,
# tinted-tmux base16-ayu-dark, and the alacritty palette.
# Palette (Shatur/neovim-ayu dark variant):
#   bg #0B0E14  fg #BFBDB6  line #11151C  panel #0F131A  selection #122132
#   red #F07178  orange #FF8F40  yellow #FFB454  green #AAD94C
#   cyan #39BAE6  blue #59C2FF  purple #D2A6FF  teal #95E6CB
#   gray #636A72  dim #454B55  accent #E6B450  error #D95757

#:schema https://yazi-rs.github.io/schemas/theme.json

# : Manager {{{

[mgr]
cwd            = { fg = "#39BAE6" }

# Find
find_keyword   = { fg = "#FFB454", bold = true, italic = true, underline = true }
find_position  = { fg = "#D2A6FF", bg = "#0F131A", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied   = { fg = "#7FD962", bg = "#7FD962" }
marker_cut      = { fg = "#F26D78", bg = "#F26D78" }
marker_marked   = { fg = "#95E6CB", bg = "#95E6CB" }
marker_selected = { fg = "#FFB454", bg = "#FFB454" }

# Count
count_copied   = { fg = "#0B0E14", bg = "#AAD94C" }
count_cut      = { fg = "#0B0E14", bg = "#F07178" }
count_selected = { fg = "#0B0E14", bg = "#FFB454" }

# Border
border_symbol = "│"
border_style  = { fg = "#454B55" }

# Syntax-highlighted previews (leave default for now)
syntect_theme  = ""

# : }}}

# : Tabs {{{

[tabs]
active   = { fg = "#0B0E14", bg = "#FFB454", bold = true }
inactive = { fg = "#FFB454", bg = "#0F131A" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}

# : Mode {{{

[mode]
normal_main = { fg = "#0B0E14", bg = "#FFB454", bold = true }
normal_alt  = { fg = "#FFB454", bg = "#0F131A" }

# Select mode
select_main = { fg = "#0B0E14", bg = "#F07178", bold = true }
select_alt  = { fg = "#F07178", bg = "#0F131A" }

# Unset mode
unset_main  = { fg = "#0B0E14", bg = "#F07178", bold = true }
unset_alt   = { fg = "#F07178", bg = "#0F131A" }

# : }}}

# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
# Square padding (reversed spaces) instead of the default rounded powerline glyphs
padding = { open = " ", close = " " }

# : }}}

# : Status bar {{{

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#454B55" }
perm_type  = { fg = "#AAD94C" }
perm_read  = { fg = "#FFB454" }
perm_write = { fg = "#F07178" }
perm_exec  = { fg = "#39BAE6" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#AAD94C", bg = "#0F131A" }
progress_error  = { fg = "#FFB454", bg = "#D95757" }

# : }}}

# : Which {{{

[which]
border          = { fg = "#59C2FF" }
mask            = {}
cand            = { fg = "#95E6CB" }
rest            = { fg = "#454B55" }
desc            = { fg = "#D2A6FF" }
separator       = "  "
separator_style = { fg = "#454B55" }

# : }}}

# : Confirmation {{{

[confirm]
border     = { fg = "#59C2FF" }
title      = { fg = "#59C2FF" }
btn_yes    = { reversed = true }
btn_no     = {}

# : }}}

# : Spotter {{{

[spot]
border = { fg = "#59C2FF" }
title  = { fg = "#59C2FF" }

# Table
tbl_col  = { fg = "#59C2FF" }
tbl_cell = { fg = "#FFB454", reversed = true }

# : }}}

# : Notification {{{

[notify]
title_info  = { fg = "#AAD94C" }
title_warn  = { fg = "#FF8F40" }
title_error = { fg = "#F07178" }

# : }}}

# : Picker {{{

[pick]
border   = { fg = "#59C2FF" }
active   = { fg = "#D2A6FF", bold = true }
inactive = {}

# : }}}

# : Input {{{

[input]
border   = { fg = "#59C2FF" }
selected = { reversed = true }

# : }}}

# : Completion {{{

[cmp]
border   = { fg = "#59C2FF" }
active   = { reversed = true }
inactive = {}

# : }}}

# : Task manager {{{

[tasks]
border  = { fg = "#59C2FF" }
hovered = { fg = "#D2A6FF", bold = true }

# : }}}

# : Help menu {{{

[help]
border  = { fg = "#59C2FF" }
chord   = { fg = "#95E6CB" }
hovered = { reversed = true, bold = true }

# : }}}

# : File-specific styles {{{

[filetype]
rules = [
	# Image
	{ mime = "image/*", fg = "#FFB454" },
	# Media
	{ mime = "{audio,video}/*", fg = "#D2A6FF" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F07178" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#39BAE6" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#636A72" },
	# Special file
	{ url = "*", is = "orphan", bg = "#D95757" },
	{ url = "*", is = "exec"  , fg = "#AAD94C" },
	# Dummy file
	{ url = "*", is = "dummy", bg = "#D95757" },
	{ url = "*/", is = "dummy", bg = "#D95757" },
	# Fallback
	{ url = "*/", fg = "#39BAE6" }
]

# : }}}
